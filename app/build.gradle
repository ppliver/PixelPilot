plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace = "com.openipc.pixelpilot"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.openipc.pixelpilot"
        minSdk = 26
        targetSdk = 34
        versionCode = 2
        versionName = "0.24.0"

        ndk {
            abiFilters.add("arm64-v8a")
            abiFilters.add("armeabi-v7a")
        }
    }

    signingConfigs {
        create("release") {
            def storeFile = findProperty("android.injected.signing.store.file")?.toString()
            if (storeFile != null && file(storeFile).exists()) {
                this.storeFile = file(storeFile)
                this.storePassword = findProperty("android.injected.signing.store.password")?.toString() ?: System.getenv("KEYSTORE_PASSWORD") ?: "release"
                this.keyAlias = findProperty("android.injected.signing.key.alias")?.toString() ?: "pixelpilot"
                this.keyPassword = findProperty("android.injected.signing.key.password")?.toString() ?: System.getenv("KEYSTORE_PASSWORD") ?: "release"
            } else {
                // 本地开发回退：使用根目录 fpv.jks（如果存在）
                def fallback = file("${rootProject.projectDir.parentFile}/fpv.jks")
                if (fallback.exists()) {
                    this.storeFile = fallback
                    this.storePassword = "release"
                    this.keyAlias = "fpv"
                    this.keyPassword = "release"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
    packaging {
        jniLibs {
            excludes += ["lib/armeabi-v7a/libmediapipe_tasks_vision_jni.so"]
            useLegacyPackaging = true
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
}

dependencies {
    implementation(project(":app:mavlink"))
    implementation(project(":app:videonative"))
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.philjay.mpandroidchart)
    implementation(libs.mediapipe.tasks.vision)
}
