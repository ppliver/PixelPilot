plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace = "com.openipc.pixelpilot"
    compileSdk 34
    compileSdkVersion 34

    defaultConfig {
        applicationId = "com.openipc.pixelpilot"
        minSdk = 26
        targetSdk = 34
        versionCode = 2
        versionName = "0.24.0"

        ndk {
            abiFilters.add("arm64-v8a")
            abiFilters.add("armeabi-v7a")
        }
    }

    signingConfigs {
        create("release") {
            def injectedStoreFile = findProperty("android.injected.signing.store.file")?.toString()
            if (injectedStoreFile != null && file(injectedStoreFile).exists()) {
                storeFile file(injectedStoreFile)
                storePassword findProperty("android.injected.signing.store.password")?.toString() ?: System.getenv("KEYSTORE_PASSWORD") ?: "release"
                keyAlias findProperty("android.injected.signing.key.alias")?.toString() ?: "pixelpilot"
                keyPassword findProperty("android.injected.signing.key.password")?.toString() ?: System.getenv("KEYSTORE_PASSWORD") ?: "release"
            } else {
                // 本地开发回退：使用根目录 fpv.jks（如果存在）
                def fallback = file("${rootProject.projectDir.parentFile}/fpv.jks")
                if (fallback.exists()) {
                    storeFile fallback
                    storePassword "release"
                    keyAlias "fpv"
                    keyPassword "release"
                } else {
                    // 无 keystore 时使用 debug 签名
                    println("WARNING: No keystore found, using debug signature")
                    storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
    packaging {
        jniLibs {
            excludes += ["lib/armeabi-v7a/libmediapipe_tasks_vision_jni.so"]
            useLegacyPackaging = true
        }
    }
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
}

dependencies {
    implementation(project(":app:mavlink"))
    implementation(project(":app:videonative"))
    implementation(project(":app:virtual-joystick"))
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.philjay.mpandroidchart)
    implementation(libs.mediapipe.tasks.vision)
}
