name: Build

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Debug Keystore if Needed
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Creating debug keystore..."
            keytool -genkeypair -v \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias androiddebugkey
          fi

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager "ndk;26.1.10909125" || true
          ls -la $ANDROID_HOME/licenses/ || true
          ls $ANDROID_HOME/ndk/ 2>/dev/null | grep 26.1.10909125 || echo "NDK version not found"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Check if valid keystore is provided
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ] && [ -f "${{ runner.temp }}/pixelpilot.jks" ]; then
            echo "Building with provided keystore..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=${{ runner.temp }}/pixelpilot.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=pixelpilot \
              -Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD
          else
            echo "Building with debug keystore..."
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=${{ runner.temp }}/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          fi

      - name: List APK Output
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release APK directory not found"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelPilot
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
